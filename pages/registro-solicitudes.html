<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de solicitudes | Fisioterapia</title>
    <link rel="stylesheet" href="../css/normalize.css" />
    <link rel="stylesheet" href="../css/common/variables.css" />
    <link rel="stylesheet" href="../css/common/base.css" />
    <link rel="stylesheet" href="../css/common/layout.css" />
    <link rel="stylesheet" href="../css/common/forms.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="app-nav">
        <div class="app-nav-brand">
          <h2>Fisioterapia</h2>
        </div>

        <ul class="nav-list">
          <li><a class="nav-link" href="dashboard.html">Inicio</a></li>
          <li><a class="nav-link" href="lista-solicitudes.html">Lista de solicitudes</a></li>
          <li><a class="nav-link nav-link-active" href="registro-solicitudes.html" aria-current="page">Registro de solicitudes</a></li>
          <li><a class="nav-link" href="sesiones-agendadas.html">Sesiones agendadas</a></li>
        </ul>

        <a class="btn btn-primary btn-block" href="../index.html">Cerrar sesión</a>
      </aside>

      <main class="app-main">
        <header class="page-header">
          <h1>Registro de solicitudes</h1>
          <p>Completa los datos para registrar una nueva solicitud</p>
        </header>

        <section class="form-card">
          <form id="registro-form" class="form-grid">
            <div class="form-field">
              <label for="nombre">Nombre del paciente</label>
              <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ej. María Gómez"
                pattern="[A-Za-zÁÉÍÓÚÑáéíóúñ ]{3,60}"
                title="Ingresa solo letras y espacios (mínimo 3 caracteres)"
                required
              />
            </div>

            <div class="form-field">
              <label for="ci">CI</label>
              <input
                type="text"
                id="ci"
                name="ci"
                placeholder="Ej. 4521678"
                inputmode="numeric"
                pattern="[0-9]{6,8}"
                title="Ingresa un CI válido de 6 a 8 dígitos"
                required
              />
            </div>

            <div class="form-field">
              <label for="fecha-solicitud">Fecha de solicitud</label>
              <input type="date" id="fecha-solicitud" name="fecha-solicitud" required />
            </div>

            <div class="form-field">
              <label for="numero-sesiones">N° de sesiones</label>
              <input
                type="number"
                id="numero-sesiones"
                name="numero-sesiones"
                placeholder="Ej. 10"
                min="1"
                max="30"
                required
              />
            </div>

            <div class="form-field">
              <label for="celular">Celular</label>
              <input
                type="tel"
                id="celular"
                name="celular"
                placeholder="Ej. 71234567"
                inputmode="numeric"
                pattern="[67][0-9]{7}"
                maxlength="8"
                title="Ingresa un celular boliviano válido de 8 dígitos (empieza con 6 o 7)"
                required
              />
            </div>

            <div class="form-field form-field-full">
              <label for="diagnostico">Diagnóstico</label>
              <textarea
                id="diagnostico"
                name="diagnostico"
                placeholder="Ej. Lumbalgia crónica"
                minlength="5"
                maxlength="200"
                required
              ></textarea>
            </div>

            <div class="form-field-full">
              <button type="submit" class="btn btn-primary btn-block">Registrar solicitud</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="../js/registro-solicitudes.js"></script>
  </body>
</html>
